      type: string
      description: |
        * `tabelle` - Die Darstellung einer Gruppe als Tabelle bietet sich an, wenn alle Untergruppen die gleichen Trefferdetails enthalten. Die Untergruppen entsprechen den Zeilen der Tabelle. * `liste` - Die Darstellung einer Gruppe als Liste bietet sich an, wenn alle Trefferdetails dieser Gruppe vom gleichen Typ sind / die gleichen Labels haben.
      enum: [tabelle, liste]
    DateValidierungsregelausdruck:
      type: string
      enum: ['^((0[1-9])|([1-2][0-9])|(3[0-1]))\.?((0[1-9])|(1[0-2]))\.?(([12])([0-9]{3}))$',
        '^((0[1-9])|([1-2][0-9])|(3[0-1])|(--))\.?((0[1-9])|(1[0-2])|(--))\.?((([12])(([0-9]){3}))|(----))$',
        '^((((0[1-9])|([1-2][0-9])|(3[0-1])|(--))\.?((0[1-9])|(1[0-2])))|((0[1-9])|(--))\.?(--))\.?((([12])(([0-9]){3})))$']
      x-enum-varnames: [OHNEMINUSZEICHEN, MITMINUSZEICHEN, EINGESCHRAENKTEMINUSZEICHEN]
      x-enum-descriptions: ['OHNEMINUSZEICHEN - Das Datum ist im Format TT.MM.JJJJ
          oder TTMMJJJJ anzugeben. Es sind nur numerische Werte erlaubt die ein gültiges
          Kalenderdatum darstellen, also z.B. 15.01.1980.', 'MITMINUSZEICHEN - Das
          Datum ist im Format TT.MM.JJJJ oder TTMMJJJJ anzugeben. Für Tag, Monat oder
          Jahr kann statt numerischer Werte der Platzhalter „--“ verwendet werden.
          Gültige Suchen sind also z.B. 15.01.1980, --.01.1980 und 15.--.----.', 'EINGESCHRAENKTEMINUSZEICHEN
          - Das Datum ist im Format TT.MM.JJJJ oder TTMMJJJJ anzugeben. Für Tag oder
          für Tag und Monat kann statt numerischer Werte der Platzhalter „--“ verwendet
          werden. Gültige Suchen sind also z.B. 15.01.1980, --.01.1980 und --.--.1980.']
    TimeValidierungsregelausdruck:
      type: string
      enum: ['^(([0-1][0-9])|(2[0-3])):?(([0-5][0-9]))$']
      x-enum-varnames: [UHRZEITFORMAT]
      description: Die Uhrzeit ist im Format hh:mm oder hhmm anzugeben.
    StringLatinValidierungsregelausdruck:
      type: string
