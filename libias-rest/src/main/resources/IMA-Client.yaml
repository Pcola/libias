openapi: 3.0.3
info: {title: ZIMP - IMA, description: Diese Spezifikation beschreibt die von ZIMP
    bereitgestellte Schnittstelle des Integrationsmoduls Abfrage (IMA)., version: 1.11.1}
servers:
- {url: 'https://zimp-prod.app.psp.bka.bund.de/services/ima', description: IMA Produktionsumgebung}
- {url: 'https://zimp-preprod.app.psp.bka.bund.de/services/ima', description: IMA
    Präproduktionsumgebung}
- {url: 'https://zimp-test.app-dev.psp.bka.bund.de/services/ima', description: IMA
    Testumgebung}
- {url: 'https://zimp-dev.app-dev.psp.bka.bund.de/services/ima', description: IMA
    Entwicklungsumgebung}
paths:
  /v1.11/metadaten/bestandsabfrage:
    get:
      tags: [Metadatenabfrage]
      summary: Metadaten der Bestandsabfrage aller zur Verfügung stehenden Systeme
      operationId: metadaten-bestandsabfrage
      parameters:
      - name: systemschluessel
        in: query
        description: Filtert die Systeme. Z.B. für Adapter, die mehr als ein System
          bereitstellen.
        required: false
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Abfragesystembeschreibung'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  ? /v1.11/metadaten/bestandsabfrage/{systemschluessel}/{dateischluessel}/{bestandsabfrageartschluessel}/suchparameterbeschreibungen
  : post:
      tags: [Metadatenabfrage]
      summary: liefert Suchparameterbeschreibung(en) kontextabhängiger Suchparameter
        einer Bestandsabfrageart
      operationId: metadaten-bestandsabfrage-kontextabhaengig
      requestBody:
        description: Metadatenabfrage mit Suchparameterschlüsseln und Abfragekontext
        content:
          application/json;charset=UTF-8:
            schema: {$ref: '#/components/schemas/Metadatenabfrage'}
        required: true
      parameters:
      - name: systemschluessel
        in: path
        description: Schlüssel des Systems (über alle Systeme eindeutig)
        required: true
        schema: {type: string}
      - name: dateischluessel
        in: path
        description: Schlüssel der Datei (über alle Dateien eines Systems eindeutig)
        required: true
        schema: {type: string}
      - name: bestandsabfrageartschluessel
        in: path
        description: Schlüssel der Bestandsabfrageart
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Suchparameterbeschreibung'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1.11/bestandsabfrage:
    post:
      tags: [Bestandsabfrage]
      summary: Bestandsabfrage - Abfrage des Bestandes ein oder mehrerer Dateien ein
        oder mehrerer Informationssysteme
      operationId: bestandsabfrage
      requestBody:
        description: Bestandsabfrage
        content:
          application/json;charset=UTF-8:
            schema: {$ref: '#/components/schemas/Bestandsabfrage'}
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Systemsuchergebnis'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      x-codegen-request-body-name: anfrage
  /v1.11/trefferdetailabfrage:
    post:
      tags: [Trefferdetailabfrage]
      summary: Trefferdetailabfrage - Detailinformationen zu einem Treffer
      operationId: trefferdetailabfrage
      requestBody:
        description: Trefferdetailabfrage
        content:
          application/json;charset=UTF-8:
            schema: {$ref: '#/components/schemas/Trefferdetailabfrage'}
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema: {$ref: '#/components/schemas/Systemsuchergebnis'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1.11/trefferanlageabfrage:
    post:
      tags: [Trefferanlageabfrage]
      summary: Trefferanlageabfrage - Anlagen (Bilder, PDF-Dokumente u.ä.) zu einem
        Treffer
      operationId: trefferanlageabfrage
      requestBody:
        description: Trefferanlageabfrage
        content:
          application/json;charset=UTF-8:
            schema: {$ref: '#/components/schemas/Trefferanlageabfrage'}
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema: {type: string, format: binary}
        '500': {$ref: '#/components/responses/InternalServerError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1.11/version:
    get:
      tags: [Version]
      summary: Versionsnummer des Adapters oder des Integrationsmoduls
      operationId: version
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Version'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1.11/formular/abrufen:
    post:
      tags: [Formular]
      summary: Das Formular mit dem angegebenen Schlüssel wird abgerufen.
      operationId: formular-abrufen
      requestBody:
        description: FormularAbrufenAnfrage
        content:
          application/json;charset=UTF-8:
            schema: {$ref: '#/components/schemas/FormularAbrufenAnfrage'}
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema: {$ref: '#/components/schemas/FormularUndFehler'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1.11/formular/speichern:
    post:
      tags: [Formular]
      summary: Das Formular mit dem angegebenen Schlüssel wird gespeichert.
      operationId: formular-speichern
      requestBody:
        description: FormularSpeichernAnfrage
        content:
          application/json;charset=UTF-8:
            schema: {$ref: '#/components/schemas/FormularSpeichernAnfrage'}
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema: {$ref: '#/components/schemas/SystemsuchergebnisUndFehler'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
