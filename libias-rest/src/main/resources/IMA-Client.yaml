        properties:
          regulaererAusdruck: {$ref: '#/components/schemas/StringLatinValidierungsregelausdruck'}
          wildcard: {$ref: '#/components/schemas/Wildcard'}
        required: [regulaererAusdruck, wildcard]
    DateValidierungsregel:
      allOf:
      - {$ref: '#/components/schemas/Validierungsregel'}
      - type: object
        properties:
          regulaererAusdruck: {$ref: '#/components/schemas/DateValidierungsregelausdruck'}
          erlaubtesDatumVon: {type: string, description: Bitte im Format TT.MM.JJJJ
              angeben.}
          erlaubtesDatumBis: {type: string, description: Bitte im Format TT.MM.JJJJ
              angeben.}
        required: [regulaererAusdruck]
    TimeValidierungsregel:
      allOf:
      - {$ref: '#/components/schemas/Validierungsregel'}
      - type: object
        properties:
          regulaererAusdruck: {$ref: '#/components/schemas/TimeValidierungsregelausdruck'}
          erlaubteUhrzeitVon: {type: string, description: 'Bitte im Format hh:mm eingeben.'}
          erlaubteUhrzeitBis: {type: string, description: 'Bitte im Format hh:mm eingeben.'}
        required: [regulaererAusdruck]
    Validierungsregelverknuepfung:
      allOf:
      - {$ref: '#/components/schemas/Validierungsregel'}
      - type: object
        properties:
          operator: {$ref: '#/components/schemas/Operator'}
          validierungsregeln:
            type: array
            items: {$ref: '#/components/schemas/Validierungsregel'}
            minItems: 1
        required: [operator, validierungsregeln]
    Regel:
      type: object
      discriminator: {propertyName: regeltyp}
      properties:
        regeltyp: {type: string}
        operator: {$ref: '#/components/schemas/Operator'}
        fehlertext: {type: string}
      required: [regeltyp, operator]
    Verknuepfung:
      allOf:
      - {$ref: '#/components/schemas/Regel'}
      - type: object
        properties:
          regeln:
            type: array
            items: {$ref: '#/components/schemas/Regel'}
            minItems: 1
        required: [regeln]
    Bedingung:
      allOf:
      - {$ref: '#/components/schemas/Regel'}
      - type: object
        properties:
          schluessel: {type: string}
          werte:
            type: array
            items: {type: string, description: Reguläre Ausdrücke sind zulässig}
            minItems: 1
        required: [schluessel, werte]
    Operator:
      type: string
      enum: [alle, mindestensEins, genauEins, keins]
      default: mindestensEins
    Abhaengigkeit:
      type: object
      discriminator: {propertyName: artDerAbhaengigkeit}
      properties:
        artDerAbhaengigkeit: {type: string}
        ausloeser: {$ref: '#/components/schemas/Regel'}
      required: [artDerAbhaengigkeit, ausloeser]
    Elementabhaengigkeit:
      allOf:
      - {$ref: '#/components/schemas/Abhaengigkeit'}
      - type: object
        properties:
          abhaengigeElemente:
            description: Schlüssel der abhängigen Elemente. Abhängige Elemente können
              Suchparameter oder Formularelemente sein.
            type: array
            items: {type: string}
            minItems: 1
        required: [abhaengigeElemente]
    Sichtbarkeitsabhaengigkeit:
      description: Bei dieser Form der Abhängigkeit geht es um die Sichtbarkeit (oder
        Unsichtbarkeit) des Suchparameters oder Formularelementes. Der genauere Name
        Elementsichtbarkeitsabhängigkeit beschreibt seine Funktion besser.
      allOf:
      - {$ref: '#/components/schemas/Elementabhaengigkeit'}
      - type: object
        properties:
          sichtbar: {type: boolean, default: true}
    Optionssichtbarkeitsabhaengigkeit:
      description: Bei dieser Form der Abhängigkeit geht es um die Sichtbarkeit (oder
        Unsichtbarkeit) der Optionen (bzw. einer Teilmenge der Optionen) des Suchparameters
        oder Formularelementes.
      allOf:
      - {$ref: '#/components/schemas/Elementabhaengigkeit'}
      - type: object
        properties:
          optionsbeschreibungen:
            type: array
            items: {$ref: '#/components/schemas/Option'}
            minItems: 1
        required: [optionsbeschreibungen]
    Validierungsabhaengigkeit:
      allOf:
      - {$ref: '#/components/schemas/Elementabhaengigkeit'}
      - type: object
        properties:
          validierungsregel: {$ref: '#/components/schemas/Validierungsregel'}
        required: [validierungsregel]
    Regelabhaengigkeit:
      allOf:
      - {$ref: '#/components/schemas/Abhaengigkeit'}
      - type: object
        properties:
          validierungsregel: {$ref: '#/components/schemas/Regel'}
        required: [validierungsregel]
    Pflichtfeldabhaengigkeit:
      allOf:
      - {$ref: '#/components/schemas/Elementabhaengigkeit'}
      - type: object
        properties:
          obligatorisch: {type: boolean, default: true}
    Systembeschreibung:
      type: object
      properties:
        systemschluessel: {type: string}
        systemname: {type: string}
        beschreibung: {type: string}
      required: [systemschluessel, systemname]
    Option:
      type: object
      properties:
        schluessel: {type: string}
        name: {type: string}
        beschreibung: {type: string}
      required: [schluessel, name]
    Information:
      type: object
      discriminator: {propertyName: informationstyp}
      properties:
        informationstyp: {type: string}
        nachricht: {type: string}
        details:
          type: array
          items: {type: string}
      required: [informationstyp, nachricht]
    Hinweis:
      allOf:
      - {$ref: '#/components/schemas/Information'}
      - type: object
        properties:
          prioritaet:
            type: string
            enum: [standard, hoch]
            default: standard
    Fehler:
      allOf:
      - {$ref: '#/components/schemas/Information'}
      - type: object
        properties:
          fehlerquelle: {$ref: '#/components/schemas/Fehlerquelle'}
          fehlerklasse:
            type: string
            enum: [technisch, fachlich]
        required: [fehlerquelle, fehlerklasse]
    Fehlerquelle:
      type: object
      properties:
        fehlerverursacherkategorie:
          type: string
          description: Kategorie des (vermuteten) Fehlerverursachers
          enum: [fremdsystem, adapter, zimp, client]
        fehlermelderkategorie:
          type: string
          description: Kategorie der Komponente, die den Fehler meldet bzw. das Fehler-Objekt
            erzeugt
          enum: [adapter, zimp]
        fehlermelderkomponente: {type: string, description: 'Komponente, die den Fehler
            meldet bzw. das Fehler-Objekt erzeugt, z.B. IMA'}
      required: [fehlerverursacherkategorie, fehlermelderkategorie]
    Version:
      type: object
      properties:
        komponente: {type: string}
        version: {type: string}
        build: {type: string}
        revision: {type: string}
      required: [komponente, version]
    PageInfo:
      type: object
      properties:
        totalPages: {type: integer}
        totalElements: {type: integer, format: int64}
    Markierung:
      type: object
      properties:
        grundDerMarkierung: {type: string}
    FormularUndFehler:
      type: object
      properties:
        formular: {$ref: '#/components/schemas/Formular'}
        inBearbeitung: {type: boolean, default: false, description: 'Ob das gelieferte
            Formular im Bearbeitungsmodus geöffnet werden soll (z.B. Editieren) oder
            nicht (z.B. Speichern), hängt von der ausgeführten Aktion ab.'}
        fehler:
          type: array
          items: {$ref: '#/components/schemas/Fehler'}
    Formular:
      type: object
      properties:
        systemschluessel: {type: string}
        postfachschluessel: {type: string}
        systemname: {type: string}
        formularschluessel: {type: string}
        formularartname: {type: string}
        elemente:
          type: array
          items: {$ref: '#/components/schemas/FormularelementOderGruppe'}
          minItems: 1
        impFachdaten: {$ref: '#/components/schemas/ImpFachdaten'}
        regeln:
          type: array
          items: {$ref: '#/components/schemas/Regel'}
        abhaengigkeiten:
          type: array
          items: {$ref: '#/components/schemas/Abhaengigkeit'}
      required: [systemschluessel, systemname, formularschluessel, formularartname,
        elemente]
    FormularelementOderGruppe:
      type: object
      discriminator: {propertyName: formularelementtyp}
      properties:
        formularelementtyp: {type: string}
        label: {type: string}
      required: [formularelementtyp]
    Formularelement:
      allOf:
      - {$ref: '#/components/schemas/FormularelementOderGruppe'}
      - type: object
        properties:
          formularelementschluessel: {type: string}
          obligatorisch: {type: boolean, default: false}
          editierbar: {type: boolean, default: false}
          fachobjektreferenzen:
            type: array
            items: {$ref: '#/components/schemas/Fachobjektreferenz'}
        required: [formularelementschluessel, obligatorisch, editierbar]
    Formularlink:
      description: Verweis auf anderes/weiteres Formular
      allOf:
      - {$ref: '#/components/schemas/Formularelement'}
      - type: object
        properties:
          wert: {type: string, description: angezeigter Text des Links}
          systemschluessel: {type: string}
          postfachschluessel: {type: string}
          formularschluessel: {type: string}
        required: [systemschluessel, postfachschluessel, formularschluessel]
    BooleanFormularelement:
      allOf:
      - {$ref: '#/components/schemas/Formularelement'}
      - type: object
        properties:
          wert: {type: boolean}
    StringFormularelement:
      allOf:
      - {$ref: '#/components/schemas/Formularelement'}
      - type: object
        properties:
          format:
            type: string
            enum: [einzeilig, mehrzeilig, html]
            default: einzeilig
          platzhalter: {type: string}
          wert: {type: string}
          validierungsregel: {$ref: '#/components/schemas/Validierungsregel'}
    LinkFormularelement:
      allOf:
      - {$ref: '#/components/schemas/Formularelement'}
      - type: object
        properties:
          url: {type: string}
          wert: {type: string}
    SingleChoiceFormularelement:
      allOf:
      - {$ref: '#/components/schemas/Formularelement'}
      - type: object
        properties:
          optionen:
            type: array
            items: {$ref: '#/components/schemas/Option'}
            minItems: 1
          wert: {type: string, description: Optionsschlüssel}
        required: [optionen]
    MultipleChoiceFormularelement:
      allOf:
      - {$ref: '#/components/schemas/Formularelement'}
      - type: object
        properties:
          optionen:
            type: array
            items: {$ref: '#/components/schemas/Option'}
            minItems: 1
          werte:
            type: array
            items: {type: string, description: Optionsschlüssel}
        required: [optionen]
    TreeFormularelement:
      allOf:
      - {$ref: '#/components/schemas/Formularelement'}
      - type: object
        properties:
          multipleChoiceErlaubt: {type: boolean, description: 'Dürfen mehrere Knoten
              ausgewählt werden?', default: true}
          optionen:
            type: array
            items: {$ref: '#/components/schemas/TreeNode'}
            minItems: 1
          werte:
            type: array
            items: {type: string, description: Optionsschlüssel}
        required: [optionen]
    TreeNode:
      allOf:
      - {$ref: '#/components/schemas/Option'}
      - type: object
        properties:
          auswaehlbar: {type: boolean, description: 'Ist dieser Knoten auswählbar?',
            default: true}
          aktiv: {type: boolean, default: true}
          hervorgehoben: {type: boolean, default: false}
          treeNodes:
            type: array
            items: {$ref: '#/components/schemas/TreeNode'}
    Anlagegruppe:
      allOf:
      - {$ref: '#/components/schemas/FormularelementOderGruppe'}
      - type: object
        properties:
          anlagegruppenschluessel: {type: string}
          maxGroesseKb: {type: integer}
          anlagen:
            type: array
            items: {$ref: '#/components/schemas/Formularelementgruppe'}
            minItems: 1
        required: [anlagegruppenschluessel, anlagen]
    Formularelementgruppe:
      allOf:
      - {$ref: '#/components/schemas/FormularelementOderGruppe'}
      - type: object
        properties:
          elemente:
            type: array
            items: {$ref: '#/components/schemas/FormularelementOderGruppe'}
          darstellungshinweise:
            type: array
            items: {$ref: '#/components/schemas/DarstellungshinweisGruppe'}
    FormularUndKontext:
      type: object
      properties:
        formular: {$ref: '#/components/schemas/Formular'}
        kontext: {$ref: '#/components/schemas/Kontext'}
      required: [formular, kontext]
    FachobjektUndIndex:
      type: object
      properties:
        fachobjekt: {$ref: '#/components/schemas/Fachobjekt'}
        impFachdatenIndex: {type: integer}
      required: [fachobjekt, impFachdatenIndex]
    FormularelementgruppeUndFehler:
      type: object
      discriminator: {propertyName: typ}
      properties:
        typ: {type: string}
        formularelementgruppe: {$ref: '#/components/schemas/Formularelementgruppe'}
        fehler:
          type: array
          items: {$ref: '#/components/schemas/Fehler'}
      required: [typ]
    FormularelementgruppeFachobjektUndFehler:
      allOf:
      - {$ref: '#/components/schemas/FormularelementgruppeUndFehler'}
      - type: object
        properties:
          fachobjekt: {$ref: '#/components/schemas/Fachobjekt'}
    Fachobjektreferenz:
      type: object
      description: Referenz auf ein Attribut eines IMP-Fachobjektes
      properties:
        fachobjekt: {type: string, description: Pfad des Fachobjektes}
        attribut: {type: string, description: relativer Pfad (im Bezug auf das Fachobjekt)
            des Fachobjektattributes}
      required: [fachobjekt, attribut]
    PdfInput:
      type: object
      discriminator: {propertyName: pdfInputTyp}
      properties:
        pdfInputTyp: {type: string}
        deckblatt: {type: boolean, default: true}
      required: [pdfInputTyp]
    Adresse:
      allOf:
      - {$ref: '#/components/schemas/Fachobjekt'}
      - type: object
        properties:
          strasse: {type: string, description: IMP-Pfad adresstyp.lagePostanschrift.anschrift.strasse}
          hausnummer: {type: string, description: IMP-Pfad adresstyp.lagePostanschrift.anschrift.hausnummer}
          plz: {type: string, description: IMP-Pfad adresstyp.lagePostanschrift.anschrift.plzOrt.plz}
          ortsname: {type: string, description: IMP-Pfad adresstyp.lagePostanschrift.anschrift.plzOrt.ortsname}
          staat: {$ref: '#/components/schemas/Katalogeintrag', description: 'IMP-Pfad
              adresstyp.lagePostanschrift.anschrift.plzOrt.staat, IMP-Katalog 285'}
          bemerkung: {type: string}
          dokument:
            type: array
            items: {$ref: '#/components/schemas/Dokument'}
    Benutzerkonto:
      allOf:
      - {$ref: '#/components/schemas/Fachobjekt'}
      - type: object
        properties:
          bezeichnung: {type: string}
          kennung: {type: string}
          bemerkung: {type: string}
    BeteiligteStelle:
      type: object
      discriminator: {propertyName: beteiligtestelletyp}
      properties:
        beteiligtestelletyp: {type: string}
        art: {$ref: '#/components/schemas/Katalogeintrag', description: IMP-Katalog
            212}
        aktenzeichen:
          type: array
          items: {type: string}
        bemerkung: {type: string}
      required: [beteiligtestelletyp, art]
    BeteiligteStelleBeteiligungsart:
      allOf:
      - {$ref: '#/components/schemas/BeteiligteStelle'}
      - type: object
        properties:
          artDerBeteiligung: {$ref: '#/components/schemas/KatalogCode', description: IMP-Katalog
              213}
    Beziehung:
      type: object
      discriminator: {propertyName: beziehungtyp}
      properties:
        beziehungtyp: {type: string}
        id: {type: string}
        rolle: {$ref: '#/components/schemas/KatalogCode', description: IMP-Katalog
            001}
        richtungsrelevant: {$ref: '#/components/schemas/KatalogCode', description: IMP-Katalog
            217}
        id1: {type: string, description: ID des ersten Fachobjektes (fachobjekt.id)}
        id2: {type: string, description: ID des zweiten Fachobjektes (fachobjekt.id)}
        bezeichnung: {type: string}
        bemerkung: {type: string}
        beginndatum: {$ref: '#/components/schemas/DatumZeit'}
        enddatum: {$ref: '#/components/schemas/DatumZeit'}
      required: [beziehungtyp, id]
    BeziehungAllgemein:
      allOf:
      - {$ref: '#/components/schemas/Beziehung'}
    BeziehungPersonStraftat:
      allOf:
      - {$ref: '#/components/schemas/Beziehung'}
    BeziehungVorgangStraftat:
      allOf:
      - {$ref: '#/components/schemas/Beziehung'}
    BeziehungHoheitlicheMassnahmePerson:
      allOf:
      - {$ref: '#/components/schemas/Beziehung'}
    DigitaleDaten:
      type: object
      properties:
        mimeType: {type: string}
        dateiId: {type: string}
        absenderId: {type: string}
        datei: {$ref: '#/components/schemas/Datei'}
      required: [mimeType, dateiId, absenderId]
    Datei:
      type: object
      discriminator: {propertyName: dateityp}
      properties:
        dateityp: {type: string}
      required: [dateityp]
    Daten:
      allOf:
      - {$ref: '#/components/schemas/Datei'}
      - type: object
        properties:
          daten: {type: string, format: byte}
    Download:
      allOf:
      - {$ref: '#/components/schemas/Datei'}
      - type: object
        properties:
          download: {type: string}
    Dokument:
      allOf:
      - {$ref: '#/components/schemas/Fachobjekt'}
      - type: object
        properties:
          art: {$ref: '#/components/schemas/Katalogeintrag', description: IMP-Katalog
              388}
          betreff: {type: string}
          bezeichnung: {type: string}
          bemerkung: {type: string}
          erstelldatum: {$ref: '#/components/schemas/SIMPDatumPattern'}
          originaldokument: {$ref: '#/components/schemas/KatalogCode', description: IMP-Katalog
              217}
          digitaleDaten: {$ref: '#/components/schemas/DigitaleDaten', description: 'IMP-Pfad
              digitaleDaten[0]'}
    Fachobjekt:
      type: object
      discriminator: {propertyName: fachobjekttyp}
      properties:
        fachobjekttyp: {type: string}
        id: {type: string, description: 'innerhalb eines IMP-Graphen eindeutige techn.
            ID, die von Beziehungen referenziert wird'}
        quellId: {type: string, description: im Informationssystem verwendete eindeutige
            ID}
      required: [fachobjekttyp, id]
    Finanztransaktion:
      allOf:
      - {$ref: '#/components/schemas/Fachobjekt'}
      - type: object
        properties:
          art: {$ref: '#/components/schemas/KatalogCode', description: IMP-Katalog
              106}
          transaktionsID: {type: string}
          verwendungszweck: {type: string}
          transaktionswaehrung: {$ref: '#/components/schemas/Katalogeintrag', description: 'IMP-Pfad
              transaktionsbetrag.waehrung, IMP-Katalog 230'}
          transaktionsbetrag: {type: number, description: IMP-Pfad transaktionsbetrag.betrag}
          transaktionsdatum: {$ref: '#/components/schemas/DatumZeit'}
          valutadatum: {$ref: '#/components/schemas/DatumZeit'}
          dokument:
            type: array
            items: {$ref: '#/components/schemas/Dokument'}
    Geld:
      allOf:
      - {$ref: '#/components/schemas/Fachobjekt'}
      - type: object
        properties:
          art: {$ref: '#/components/schemas/KatalogCode', description: IMP-Katalog
              104}
          seriennummer: {type: string}
          ausgabejahr: {type: integer}
          erkenntnisseAusVerdeckterMassnahme: {$ref: '#/components/schemas/KatalogCode',
            description: IMP-Katalog 217}
          bemerkung: {type: string}
          waehrung: {$ref: '#/components/schemas/Katalogeintrag', description: 'IMP-Pfad
              nennwert.waehrung, IMP-Katalog 230'}
          betrag: {type: number, description: IMP-Pfad nennwert.betrag}
          dokument:
            type: array
            items: {$ref: '#/components/schemas/Dokument'}
    Bargeld:
      allOf:
      - {$ref: '#/components/schemas/Geld'}
      - type: object
        properties:
          bezeichnung: {type: string}
          ausgabeStaat: {$ref: '#/components/schemas/Katalogeintrag', description: IMP-Katalog
              208}
          emittent: {$ref: '#/components/schemas/Katalogeintrag', description: IMP-Katalog
              209}
    Falschgeld:
      allOf:
      - {$ref: '#/components/schemas/Geld'}
    HoheitlicheMassnahme:
      allOf:
      - {$ref: '#/components/schemas/Fachobjekt'}
      - type: object
        properties:
          art: {$ref: '#/components/schemas/KatalogCode', description: IMP-Katalog
              108}
          bezeichnung: {type: string}
          verdeckteMassnahme: {$ref: '#/components/schemas/KatalogCode', description: IMP-Katalog
              217}
          bemerkung: {type: string}
          beginn: {$ref: '#/components/schemas/DatumZeit'}
          ende: {$ref: '#/components/schemas/DatumZeit'}
          dokument:
            type: array
            items: {$ref: '#/components/schemas/Dokument'}
        required: [art, beginn]
    ImpFachdaten:
      type: object
      properties:
        objekte:
          description: Die Reihenfolge der Fachobjekte im Array ist in JSON festgelegt,
            s.a. RFC 8259.
          type: array
          items: {$ref: '#/components/schemas/Fachobjekt'}
        beziehungen:
          type: array
          items: {$ref: '#/components/schemas/Beziehung'}
    Internetressource:
      allOf:
      - {$ref: '#/components/schemas/Fachobjekt'}
      - type: object
        properties:
          art: {$ref: '#/components/schemas/KatalogCode', description: IMP-Katalog
              315}
          bezeichnung: {type: string}
          uRI: {type: string}
          bemerkung: {type: string}
          iPv4: {type: string}
          dokument:
            type: array
            items: {$ref: '#/components/schemas/Dokument'}
        required: [bezeichnung]
    Katalogeintrag:
      description: Eintrag in einem abgeschlossenen IMP-Katalog
      type: object
      x-abstract: true
      discriminator: {propertyName: katalogeintragstyp}
      properties:
        katalogeintragstyp: {type: string, description: Typ des Katalogeintrages}
        katalog: {type: string, description: 'Schlüssel des Kataloges gemäß XPolizei-TYP3-Codelisten;
            entspricht der Nummer im Namen des IMP-Katalogcode-Objekts, z.B. 118 in
            KatalogCode118'}
        wert: {type: string, description: Wert des Katalogeintrags}
      required: [katalogeintragstyp, katalog, wert]
    KatalogCode:
      description: Eintrag in einem abgeschlossenen IMP-Katalog
      allOf:
      - {$ref: '#/components/schemas/Katalogeintrag'}
      - type: object
        properties:
          version: {type: string, description: 'Version des Kataloges im Format "V<major>.<minor>",
              z.B. V1.2'}
          code: {type: string, description: Schlüssel/Code des Katalogeintrags}
        required: [version, code]
    KatalogCodeNichtAbgeschlossen:
      description: zusätzlicher Eintrag in einem nicht abgeschlossenen IMP-Katalog
      allOf:
      - {$ref: '#/components/schemas/Katalogeintrag'}
    Kommunikationsanschluss:
      allOf:
      - {$ref: '#/components/schemas/Fachobjekt'}
      - type: object
        properties:
          art: {$ref: '#/components/schemas/KatalogCode', description: IMP-Katalog
              110}
          bezeichnung: {type: string}
          kennung: {type: string}
          rufnummer: {type: string}
          bemerkung: {type: string}
    Konto:
