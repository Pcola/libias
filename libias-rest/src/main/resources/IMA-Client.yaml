  /v1.11/trefferdetailabfrage/dokument:
    post:
      tags: [Trefferdetailabfrage]
      summary: erzeugt (in Dokument verpacktes) PDF für einen Treffer
      operationId: pdfAusTrefferdetailsAlsDokument
      requestBody:
        description: Daten für das zu generierende PDF - Suchergebnis mit Trefferdetails
        content:
          application/json;charset=UTF-8:
            schema: {$ref: '#/components/schemas/TrefferPdfInput'}
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema: {$ref: '#/components/schemas/Dokument'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /v1.11/trefferdetailabfrage/pdf:
    post:
      tags: [Trefferdetailabfrage]
      summary: erzeugt PDF für einen Treffer
      operationId: pdfAusTrefferdetails
      requestBody:
        description: Daten für das zu generierende PDF - Suchergebnis mit Trefferdetails
        content:
          application/json;charset=UTF-8:
            schema: {$ref: '#/components/schemas/TrefferPdfInput'}
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /v1.11/bestandsabfrage/dokument:
    post:
      tags: [Bestandsabfrage]
      summary: erzeugt (in Dokument verpacktes) PDF für ein oder mehrere Trefferlisten
      operationId: pdfAusTrefferlistenAlsDokument
      requestBody:
        description: Daten für das zu generierende PDF - Suchparameter und Suchergebnisse
        content:
          application/json;charset=UTF-8:
            schema: {$ref: '#/components/schemas/TrefferlistenPdfInput'}
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema: {$ref: '#/components/schemas/Dokument'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /v1.11/bestandsabfrage/pdf:
    post:
      tags: [Bestandsabfrage]
      summary: erzeugt PDF für ein oder mehrere Trefferlisten
      operationId: pdfAusTrefferlisten
      requestBody:
        description: Daten für das zu generierende PDF - Suchparameter und Suchergebnisse
        content:
          application/json;charset=UTF-8:
            schema: {$ref: '#/components/schemas/TrefferlistenPdfInput'}
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /v1.11/bestandsabfrage/historie/{page}/{size}:
    get:
      tags: [Bestandsabfrage]
      summary: liefert eine Seite der Bestandsabfragehistorie (eines Nutzers)
      operationId: bestandsabfragehistorie
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema: {$ref: '#/components/schemas/Bestandsabfragehistorienseite'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    parameters:
    - name: page
      in: path
      description: Seite (Pagination)
      required: true
      schema: {type: integer, minimum: 0}
    - name: size
      in: path
      description: Anzahl der Sammelabfragen pro Seite (Pagination)
      required: true
      schema: {type: integer}
    - name: systemschluessel
      in: query
      description: Schlüssel des Informationssystems (Filter)
      required: false
      schema: {type: string}
    - name: status
      in: query
      description: Status der Sammelabfragen (Filter)
      required: false
      schema:
        type: string
        enum: [abgeschlossen, inBearbeitung]
    - name: ergebnisId
      in: query
      description: Base64Url-kodierte Ergebnis-IDs bei asynchronen Bestandsabfragen
        (Filter)
      required: false
      schema:
        type: array
        items: {type: string, format: byte}
  /v1.11/bestandsabfrage/abfragegrund:
    post:
      tags: [Bestandsabfrage]
      summary: Speicherung des Abfragegrunds nach Anzeige eines Sperrbildschirms
      operationId: abfragegrund
      requestBody:
        description: Daten zur Speicherung des Abfragegrunds
        content:
          application/json;charset=UTF-8:
            schema:
              title: SperrbildschirmAntwort
              type: object
              properties:
                abfragegrundId: {type: string}
                abfragegrund: {type: string}
                abgebrochen: {type: boolean}
              required: [abfragegrundId, abgebrochen]
        required: true
      responses:
        '200': {description: OK}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
      x-codegen-request-body-name: sperrbildschirmAntwort
  /v1.11/bestandsabfrage/imp2suchparameter:
    post:
      tags: [Bestandsabfrage]
      summary: liefert Suchparameter ausgehend von einem IMP Fachobjekt
      operationId: fachobjektToSuchparameter
      requestBody:
        description: IMP Fachobjekt
        content:
          application/json;charset=UTF-8:
            schema: {$ref: '#/components/schemas/FachobjektUndSuchparameterschluessel'}
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Suchparameter'}
        '401': {$ref: '#/components/responses/Unauthorized'}
      x-codegen-request-body-name: fachobjekt
  /v1.11/metadaten/bestandsabfragearten:
    get:
      tags: [Metadatenabfrage]
      summary: Alle für den Nutzer verfügbaren Bestandsabfragearten der Metadatenabfrage
      operationId: metadaten-bestandsabfragearten
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Bestandsabfrageart'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1.11/metadaten/bestandsabfrage/{bestandsabfrageart}:
    get:
      tags: [Metadatenabfrage]
      summary: Metadaten der Bestandsabfrage aller dem Nutzer zur Verfügung stehenden
        Systeme mit der angegebenen Bestandsabfrageart
      operationId: metadaten-bestandsabfrage-nach-bestandsabfrageart
      parameters:
      - name: bestandsabfrageart
        in: path
        description: Bestandsabfrageart der gesuchten Bestandsabfragebeschreibungen
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Abfragesystembeschreibung'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1.11/status/adapter:
    get:
      tags: [Status]
      summary: liefert die Status aller an das IMA angeschlossenen Adapter
      operationId: adapterstatus
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Adapterstatus'}
components:
  schemas:
    Abfrage:
      type: object
      discriminator: {propertyName: abfragetyp}
      properties:
        abfragetyp: {type: string}
        abfragekontext: {$ref: '#/components/schemas/Kontext'}
        abfrageparameter:
          type: array
          items: {$ref: '#/components/schemas/Parameter'}
      required: [abfragetyp, abfragekontext]
    Bestandsabfrage:
      allOf:
      - {$ref: '#/components/schemas/Abfrage'}
      - type: object
        properties:
          bestandsabfrageart: {type: string, description: identisch mit Attribut "schluessel"
              des Schema-Elementes "Bestandsabfrageart"}
          systeme:
            type: array
            items: {$ref: '#/components/schemas/Anfragesystem'}
            minItems: 1
        required: [bestandsabfrageart, systeme]
    Trefferabfrage:
      allOf:
      - {$ref: '#/components/schemas/Abfrage'}
      - type: object
        properties:
          systemschluessel: {description: Schlüssel des Systems (über alle Systeme
              eindeutig), type: string}
          dateischluessel: {description: Schlüssel der Datei (über alle Dateien eines
              Systems eindeutig), type: string}
          trefferschluessel: {description: Schlüssel des Treffers (innerhalb einer
              Datei eindeutig), type: string}
        required: [systemschluessel, dateischluessel, trefferschluessel]
    Trefferdetailabfrage:
      allOf:
      - {$ref: '#/components/schemas/Trefferabfrage'}
    Trefferanlageabfrage:
      allOf:
      - {$ref: '#/components/schemas/Trefferabfrage'}
      - type: object
        properties:
          herkunftschluessel: {description: 'Schlüssel eines Containers, Formulars
              etc., in dem sich die Anlage befindet', type: string}
          anlageschluessel: {description: Schlüssel der Anlage (innerhalb eines Treffers
              eindeutig), type: string}
        required: [herkunftschluessel, anlageschluessel]
    Anfragedatei:
      type: object
      properties:
        dateischluessel: {type: string}
        suchparameter:
          type: array
          items: {$ref: '#/components/schemas/Suchparameter'}
          minItems: 1
      required: [dateischluessel, suchparameter]
    Anfragesystem:
      type: object
      properties:
        systemschluessel: {type: string}
        dateien:
          type: array
          items: {$ref: '#/components/schemas/Anfragedatei'}
          minItems: 1
      required: [systemschluessel, dateien]
    Dateisuchergebnis:
      type: object
      discriminator: {propertyName: dateisuchergebnistyp}
      properties:
        dateisuchergebnistyp: {type: string}
        dateischluessel: {type: string}
        dateiname: {type: string}
        antwortzeitpunkt: {type: string, format: date-time, description: wird vom
            IMA befüllt}
        hinweise:
          type: array
          items: {$ref: '#/components/schemas/Hinweis'}
        fehler:
          type: array
          items: {$ref: '#/components/schemas/Fehler'}
        impFachdaten: {$ref: '#/components/schemas/ImpFachdaten'}
        rohdaten: {$ref: '#/components/schemas/Rohdaten'}
      required: [dateisuchergebnistyp, dateischluessel, dateiname]
    DateisuchergebnisMitTrefferlisten:
      allOf:
      - {$ref: '#/components/schemas/Dateisuchergebnis'}
      - type: object
        properties:
          synopsis: {type: string}
          trefferlisten:
            type: array
            items: {$ref: '#/components/schemas/Trefferliste'}
      properties:
        sperrbildschirm: {$ref: '#/components/schemas/Sperrbildschirm'}
    UnvollstaendigesDateisuchergebnisMitTrefferlisten:
      allOf:
      - {$ref: '#/components/schemas/DateisuchergebnisMitTrefferlisten'}
      - type: object
        properties:
          ergebnisId: {type: string}
        required: [ergebnisId]
    DateisuchergebnisMitTrefferdetails:
      allOf:
      - {$ref: '#/components/schemas/Dateisuchergebnis'}
      - type: object
        properties:
          trefferschluessel: {type: string}
          treffername: {type: string}
          trefferart: {type: string, description: 'Bezeichnung des Trefferaufbaus
              (innerhalb einer Datei eindeutig); korrespondiert häufig mit einem IMP-Fachobjekt,
              z.B. PERSONALIE, KRAFTFAHRZEUG; wird im Konfigurationsservice benötigt'}
          trefferdetails:
            type: array
            items: {$ref: '#/components/schemas/TrefferdetailOderQuerverweis'}
        required: [trefferschluessel, treffername, trefferart]
    Parameter:
      type: object
      properties:
        parameterschluessel: {type: string}
        wert: {type: string}
      required: [parameterschluessel, wert]
    Systemsuchergebnis:
      type: object
      properties:
        systemschluessel: {type: string}
        systemname: {type: string}
        dateisuchergebnisse:
          type: array
          items: {$ref: '#/components/schemas/Dateisuchergebnis'}
          minItems: 1
      required: [systemschluessel, systemname, dateisuchergebnisse]
    Treffer:
      type: object
      properties:
        trefferschluessel: {type: string}
        trefferattribute:
          type: array
          items: {$ref: '#/components/schemas/Trefferattribut'}
          minItems: 1
        markierung: {$ref: '#/components/schemas/Markierung'}
      required: [trefferschluessel, trefferattribute]
    Trefferattribut:
      type: object
      properties:
        trefferattributschluessel: {type: string}
        trefferattributwert: {type: string}
        fachobjektreferenzen:
          type: array
          items: {$ref: '#/components/schemas/Fachobjektreferenz'}
        quellreferenz: {$ref: '#/components/schemas/Quellreferenz'}
      required: [trefferattributschluessel]
    Trefferattributbeschreibung:
      type: object
      properties:
        trefferattributschluessel: {type: string}
        trefferattributname: {type: string}
        datentyp:
          type: string
          enum: [text, bild]
        bedeutsamkeit: {$ref: '#/components/schemas/Bedeutsamkeit'}
      required: [trefferattributschluessel, trefferattributname, datentyp]
    Trefferliste:
      type: object
      properties:
        trefferlistenart: {type: string, description: 'Bezeichnung des Trefferlistenaufbaus
            (innerhalb einer Datei eindeutig); korrespondiert häufig mit einem IMP-Fachobjekt,
            z.B. PERSONALIE, KRAFTFAHRZEUG; wird im Konfigurationsservice benötigt'}
        trefferlistenname: {type: string}
        trefferattributbeschreibungen:
          type: array
          items: {$ref: '#/components/schemas/Trefferattributbeschreibung'}
        treffer:
          type: array
          items: {$ref: '#/components/schemas/Treffer'}
      required: [trefferlistenart, trefferlistenname]
    TrefferdetailOderQuerverweis:
      type: object
      description: abstraktes Objekt
      discriminator: {propertyName: trefferdetailtyp}
      properties:
        trefferdetailtyp: {type: string}
        label: {type: string}
      required: [trefferdetailtyp]
    Querverweis:
      allOf:
      - {$ref: '#/components/schemas/TrefferdetailOderQuerverweis'}
      - type: object
        properties:
