      x-enum-varnames: [STRINGLATINFORMAT]
      description: Alle im Zeichensatz String-Latin definierten Zeichen sind zulässig.
    Wildcard:
      type: object
      properties:
        einOderMehrereZeichen: {description: Als Wildcard für ein oder mehrere Zeichen
            ist "*" zu verwenden., type: boolean, default: false}
        genauEinZeichen: {description: 'Als Wildcard für genau ein Zeichen ist "?"
            zu verwenden.', type: boolean, default: false}
      required: [einOderMehrereZeichen, genauEinZeichen]
    Validierungsregel:
      type: object
      discriminator: {propertyName: regeltyp}
      properties:
