          fehlertext: {type: string, example: 'Der Suchparameter enthält Zeichen,
              die nicht den Zeichen A-Z entsprechen.'}
          wildcard: {$ref: '#/components/schemas/Wildcard'}
        required: [regulaererAusdruck, eingabehilfe, fehlertext, wildcard]
    StringLatinValidierungsregel:
      type: object
      allOf:
